data:
  batch_size: 128
  color_jitter_strength: 0.0
  crop_scale:
  - 0.3
  - 1.0
  crop_size: 224
  image_folder: imagenet/
  lmdb_path: null
  num_workers: 1
  prefetch_factor: 1
  pin_mem: true
  root_path: data/imagenet
  use_color_distortion: false
  use_gaussian_blur: false
  use_horizontal_flip: false
logging:
  folder: logs/downstream/imagenet/linear_in1k_vitb16_ep200/
  write_tag: jepa_linear
meta:
  dataset_name: imagenet 
  num_samples_per_class: -1
  strategy: linear
  copy_data: false
  load_checkpoint: true
  model_name: vit_base
  read_checkpoint: logs/in1k100_linear_vitb16_ep300/pretrain-latest.pth.tar
  use_bfloat16: true
model:
  patch_size: 16
optimization:
  scheduler_type: cosine
  epochs: 200
  final_lr: 1.0e-06
  final_weight_decay: 0.4
  ipe_scale: 1.0
  lr: 0.001
  start_lr: 0.0002
  warmup: 40
  weight_decay: 0.04
